<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit Catalogue — CatalogueWala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --teal: #00C49A;
    --teal-dark: #00A888;
    --mint: #E8FBF5;
    --orange: #FF6B35;
    --orange-dark: #E85A26;
    --blue: #00A8FF;
    --text: #1a2b3c;
    --muted: #6b7a8a;
    --border: #e5ecf2;
    --white: #ffffff;
    --danger: #e53935;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: #f7fafb;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  img { max-width: 100%; display: block; }
  button, a, input { font-family: inherit; }

  /* ---------- NAVBAR ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo {
    font-weight: 800;
    font-size: 20px;
    color: var(--teal);
    letter-spacing: -0.5px;
    text-decoration: none;
  }
  .logo span { color: var(--orange); }
  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--mint);
    color: var(--teal-dark);
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    border: 1px solid rgba(0,196,154,0.25);
    transition: background 0.2s;
  }
  .nav-link:hover { background: #d6f5eb; }

  /* ---------- STATES ---------- */
  .state {
    min-height: calc(100vh - 60px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .state.show { display: flex; }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid var(--mint);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-text { color: var(--muted); font-weight: 500; margin-top: 14px; }

  .denied-icon { font-size: 60px; margin-bottom: 12px; }
  .denied h1 {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }
  .denied p { color: var(--muted); max-width: 440px; margin: 0 auto; }

  /* ---------- EDIT UI ---------- */
  .editor { display: none; }
  .editor.show { display: block; }
  .editor-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  .page-head {
    margin-bottom: 22px;
  }
  .page-head h1 {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .page-head p { color: var(--muted); font-size: 15px; }

  /* ---------- SECTION CARD ---------- */
  .section-card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 2px 12px rgba(20,40,60,0.05);
    border: 1px solid var(--border);
  }
  .section-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--teal-dark);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .num {
    background: var(--teal);
    color: white;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }

  /* ---------- FIELDS ---------- */
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }
  .field:last-child { margin-bottom: 0; }
  .field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .field input[type="text"],
  .field input[type="tel"],
  .field input[type="number"] {
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    background: var(--white);
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }
  .field input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 4px rgba(0,196,154,0.15);
  }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 520px) { .two-col { grid-template-columns: 1fr; } }

  /* ---------- BUTTONS ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
  }
  .btn-primary {
    background: var(--teal);
    color: white;
    box-shadow: 0 4px 14px rgba(0,196,154,0.3);
  }
  .btn-primary:hover { background: var(--teal-dark); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .btn-accent {
    background: var(--orange);
    color: white;
    box-shadow: 0 4px 14px rgba(255,107,53,0.3);
  }
  .btn-accent:hover { background: var(--orange-dark); transform: translateY(-1px); }

  .btn-ghost {
    background: var(--mint);
    color: var(--teal-dark);
    border: 1.5px dashed var(--teal);
  }
  .btn-ghost:hover { background: #d6f5eb; }

  .btn-danger {
    background: #fde8e7;
    color: var(--danger);
  }
  .btn-danger:hover { background: #fbd0cd; }

  .btn-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .save-status {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .save-status.success { color: var(--teal-dark); }
  .save-status.error { color: var(--danger); }

  /* ---------- PRODUCTS LIST ---------- */
  .products-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .products-count {
    font-size: 14px;
    color: var(--muted);
    font-weight: 500;
  }

  .products-list { display: flex; flex-direction: column; gap: 14px; }

  .product-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 10px rgba(20,40,60,0.05);
    border: 1px solid var(--border);
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 16px;
    transition: border-color 0.2s;
  }
  .product-card.draft { border-color: var(--orange); border-style: dashed; }
  .product-card.saving { opacity: 0.75; }

  .photo-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .photo-preview {
    width: 110px; height: 110px;
    border-radius: 10px;
    object-fit: cover;
    background: var(--mint);
    border: 1px solid var(--border);
  }
  .photo-placeholder {
    width: 110px; height: 110px;
    border-radius: 10px;
    background: linear-gradient(135deg, #00C49A 0%, #00A8FF 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: white;
  }
  .upload-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 10px;
    background: var(--mint);
    color: var(--teal-dark);
    border-radius: 8px;
    font-weight: 600;
    font-size: 12px;
    border: 1.5px dashed var(--teal);
    cursor: pointer;
    transition: background 0.2s;
    text-align: center;
  }
  .upload-btn:hover { background: #d6f5eb; }
  .upload-btn input { display: none; }
  .upload-btn.uploading { opacity: 0.6; pointer-events: none; }

  .product-body { display: flex; flex-direction: column; gap: 10px; }
  .product-row {
    display: grid;
    grid-template-columns: 1fr 130px;
    gap: 10px;
  }
  @media (max-width: 480px) {
    .product-card { grid-template-columns: 1fr; }
    .photo-wrap { flex-direction: row; align-items: center; }
    .product-row { grid-template-columns: 1fr; }
  }

  .product-status {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    min-height: 16px;
  }
  .product-status.success { color: var(--teal-dark); }
  .product-status.error { color: var(--danger); }
  .product-status.saving { color: var(--orange); }

  .product-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .empty-products {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    background: var(--mint);
    border-radius: 14px;
    font-weight: 500;
  }
  .empty-products .big { font-size: 38px; margin-bottom: 8px; }

  /* ---------- TOAST ---------- */
  .toast-container {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    width: min(360px, calc(100vw - 40px));
  }
  .toast {
    background: var(--text);
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.22);
    opacity: 0;
    transform: translateY(10px);
    animation: toastIn 0.25s ease forwards;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.success { background: var(--teal-dark); }
  .toast.error { background: var(--danger); }
  .toast.info { background: var(--text); }
  @keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }
</style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="nav">
  <div class="nav-inner">
    <a href="landing.html" class="logo">Catalogue<span>Wala</span></a>
    <a class="nav-link" id="liveLink" href="#" target="_blank" rel="noopener" style="display:none;">
      👁 <span>View Live Catalogue</span>
    </a>
  </div>
</nav>

<!-- ================= LOADING ================= -->
<div class="state show" id="loadingState">
  <div>
    <div class="spinner" style="margin:0 auto;"></div>
    <div class="state-text">Checking access…</div>
  </div>
</div>

<!-- ================= ACCESS DENIED ================= -->
<div class="state denied" id="deniedState">
  <div>
    <div class="denied-icon">🔒</div>
    <h1 id="deniedTitle">Access denied</h1>
    <p id="deniedMsg">This edit link is invalid or the shop doesn't exist. Please check your link and try again.</p>
  </div>
</div>

<!-- ================= EDITOR ================= -->
<div class="editor" id="editorState">
  <div class="editor-wrap">

    <div class="page-head">
      <h1 id="editorTitle">Edit your catalogue</h1>
      <p>Changes save automatically as you edit.</p>
    </div>

    <!-- SHOP DETAILS -->
    <div class="section-card">
      <div class="section-title"><span class="num">1</span> Shop Details</div>
      <div class="field">
        <label for="fShopName">Shop Name</label>
        <input type="text" id="fShopName" />
      </div>
      <div class="two-col">
        <div class="field">
          <label for="fCity">City</label>
          <input type="text" id="fCity" />
        </div>
        <div class="field">
          <label for="fWhatsapp">WhatsApp Number</label>
          <input type="tel" id="fWhatsapp" />
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="saveShopBtn">💾 Save Changes</button>
        <span class="save-status" id="shopStatus"></span>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div class="section-card">
      <div class="section-title"><span class="num">2</span> Your Products</div>
      <div class="products-header">
        <div class="products-count" id="productsCount">0 products</div>
        <button class="btn btn-accent" id="addProductBtn">＋ Add New Product</button>
      </div>
      <div class="products-list" id="productsList"></div>
    </div>

  </div>
</div>

<!-- ================= TOASTS ================= -->
<div class="toast-container" id="toastContainer"></div>

<script>
  // ===================================================================
  //  SUPABASE CONFIG
  // ===================================================================
  const SUPABASE_URL = 'https://fakklaqisfofkpagxotk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZha2tsYXFpc2ZvZmtwYWd4b3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3OTUwNjcsImV4cCI6MjEwMDM3MTA2N30.rSa1_7kGLkMUfyDgs9cDddsxtWIfNTwyiI1NYNxxJBc';
  const STORAGE_BUCKET = 'product-photos-v2';

  const CLOUDINARY_CLOUD_NAME = 'c3josacx';
  const CLOUDINARY_UPLOAD_PRESET = 'Catalougewala';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

    const response = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      { method: 'POST', body: formData }
    );
    const data = await response.json();
    if (!data.secure_url) throw new Error('Cloudinary upload failed');
    return data.secure_url;
  }

  // Schema:
  //   shops:    id, shop_name, city, whatsapp, edit_code
  //   products: id, shop_id, name, price, photo_url

  // ===================================================================
  //  STATE
  // ===================================================================
  let currentShop = null;
  let currentProducts = [];
  const saveTimers = {};   // per-product debounce timers

  // ===================================================================
  //  UTILITIES
  // ===================================================================
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function showState(which, opts = {}) {
    document.getElementById('loadingState').classList.toggle('show', which === 'loading');
    document.getElementById('deniedState').classList.toggle('show', which === 'denied');
    document.getElementById('editorState').classList.toggle('show', which === 'editor');
    if (opts.title) document.getElementById('deniedTitle').textContent = opts.title;
    if (opts.msg)   document.getElementById('deniedMsg').textContent = opts.msg;
  }

  function toast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = (type === 'success' ? '✓ ' : type === 'error' ? '⚠ ' : 'ℹ ') + escapeHtml(message);
    container.appendChild(el);
    setTimeout(() => {
      el.style.animation = 'toastOut 0.25s ease forwards';
      setTimeout(() => el.remove(), 300);
    }, 2600);
  }

  async function compressImageFile(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const maxDim = 1200;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => {
          if (!blob) return reject(new Error('compression failed'));
          resolve(new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.82);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image load failed')); };
      img.src = url;
    });
  }

  // ===================================================================
  //  ACCESS GATE
  // ===================================================================
  async function init() {
    const params = new URLSearchParams(window.location.search);
    const shopId = params.get('shop');
    const code   = params.get('code');

    if (!shopId || !code) {
      return showState('denied', {
        title: 'Missing link details',
        msg: 'Your edit link needs both ?shop=ID and ?code=CODE parameters.'
      });
    }

    try {
      const { data: shop, error } = await supabaseClient
        .from('shops')
        .select('*')
        .eq('id', shopId)
        .maybeSingle();

      if (error) throw error;
      if (!shop) return showState('denied', { title: 'Shop not found', msg: "We couldn't find a shop matching this link." });
      if (!shop.edit_code || shop.edit_code !== code) {
        return showState('denied', { title: 'Access denied', msg: 'The access code in this link is wrong. Use the link you were given to edit your catalogue.' });
      }

      currentShop = shop;
      await loadProducts();
      renderEditor();
    } catch (err) {
      console.error(err);
      showState('denied', { title: 'Connection error', msg: "We couldn't reach the server. Please check your internet and try again." });
    }
  }

  async function loadProducts() {
    const { data, error } = await supabaseClient
      .from('products')
      .select('*')
      .eq('shop_id', currentShop.id)
      .order('id', { ascending: true });
    if (error) throw error;
    currentProducts = data || [];
  }

  // ===================================================================
  //  RENDER EDITOR
  // ===================================================================
  function renderEditor() {
    // Live link
    const liveLink = document.getElementById('liveLink');
    liveLink.href = `Catalougewallamain.html?shop=${encodeURIComponent(currentShop.id)}`;
    liveLink.style.display = 'inline-flex';

    // Shop fields
    document.getElementById('fShopName').value = currentShop.shop_name || '';
    document.getElementById('fCity').value = currentShop.city || '';
    document.getElementById('fWhatsapp').value = currentShop.whatsapp || '';

    document.getElementById('editorTitle').textContent = 'Edit ' + (currentShop.shop_name || 'your catalogue');

    renderProducts();
    showState('editor');
  }

  function renderProducts() {
    const list = document.getElementById('productsList');
    const count = document.getElementById('productsCount');
    count.textContent = currentProducts.length + (currentProducts.length === 1 ? ' product' : ' products');
    list.innerHTML = '';

    if (currentProducts.length === 0) {
      list.innerHTML = `
        <div class="empty-products">
          <div class="big">📦</div>
          No products yet. Click "Add New Product" to start.
        </div>`;
      return;
    }

    currentProducts.forEach(p => list.appendChild(buildProductCard(p)));
  }

  function buildProductCard(product) {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.dataset.productId = product.id;

    const photoHtml = product.photo_url
      ? `<img class="photo-preview" src="${escapeHtml(product.photo_url)}" alt="" onerror="this.outerHTML='<div class=\\'photo-placeholder\\'>📷</div>'" />`
      : `<div class="photo-placeholder">📷</div>`;

    card.innerHTML = `
      <div class="photo-wrap">
        <div class="photo-slot" data-slot="${product.id}">${photoHtml}</div>
        <label class="upload-btn" data-upload-label="${product.id}">
          📷 ${product.photo_url ? 'Change' : 'Add'} photo
          <input type="file" accept="image/*" data-upload="${product.id}" />
        </label>
      </div>
      <div class="product-body">
        <div class="product-row">
          <div class="field" style="margin:0;">
            <label>Product Name</label>
            <input type="text" data-field="name" data-id="${product.id}" value="${escapeHtml(product.name || '')}" placeholder="e.g. Basmati Rice 5kg" />
          </div>
          <div class="field" style="margin:0;">
            <label>Price (₹)</label>
            <input type="number" data-field="price" data-id="${product.id}" value="${product.price ?? ''}" placeholder="e.g. 450" min="0" />
          </div>
        </div>
        <div class="product-status" data-status="${product.id}"></div>
        <div class="product-actions">
          <button type="button" class="btn btn-danger" data-delete="${product.id}">🗑 Delete</button>
        </div>
      </div>
    `;

    return card;
  }

  function setProductStatus(productId, text, type = '') {
    const el = document.querySelector(`[data-status="${productId}"]`);
    if (!el) return;
    el.textContent = text;
    el.className = 'product-status ' + type;
  }

  function setCardSaving(productId, saving) {
    const card = document.querySelector(`.product-card[data-product-id="${productId}"]`);
    if (card) card.classList.toggle('saving', saving);
  }

  // ===================================================================
  //  SAVE SHOP DETAILS
  // ===================================================================
  document.getElementById('saveShopBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveShopBtn');
    const status = document.getElementById('shopStatus');
    const payload = {
      shop_name: document.getElementById('fShopName').value.trim(),
      city: document.getElementById('fCity').value.trim(),
      whatsapp: document.getElementById('fWhatsapp').value.trim()
    };
    btn.disabled = true;
    status.textContent = 'Saving…';
    status.className = 'save-status';
    try {
      const { error } = await supabaseClient
        .from('shops')
        .update(payload)
        .eq('id', currentShop.id);
      if (error) throw error;
      Object.assign(currentShop, payload);
      document.getElementById('editorTitle').textContent = 'Edit ' + (payload.shop_name || 'your catalogue');
      status.textContent = '✓ Saved!';
      status.className = 'save-status success';
      toast('Shop details saved', 'success');
    } catch (err) {
      console.error(err);
      status.textContent = '✗ Save failed — please try again';
      status.className = 'save-status error';
      toast('Could not save shop details', 'error');
    } finally {
      btn.disabled = false;
    }
  });

  // ===================================================================
  //  AUTO-SAVE PRODUCT FIELDS (debounced)
  // ===================================================================
  document.getElementById('productsList').addEventListener('input', (e) => {
    const field = e.target.dataset.field;
    const id = e.target.dataset.id;
    if (!field || !id) return;

    const productId = Number(id);
    const product = currentProducts.find(p => p.id === productId);
    if (!product) return;

    // Update local state immediately
    if (field === 'price') {
      const v = e.target.value.trim();
      product.price = v === '' ? null : Number(v);
    } else {
      product[field] = e.target.value;
    }

    // Debounced save
    clearTimeout(saveTimers[productId]);
    setProductStatus(productId, 'Saving…', 'saving');
    setCardSaving(productId, true);
    saveTimers[productId] = setTimeout(() => saveProductField(productId, field), 650);
  });

  async function saveProductField(productId, field) {
    const product = currentProducts.find(p => p.id === productId);
    if (!product) return;
    try {
      const payload = { [field]: product[field] };
      const { error } = await supabaseClient
        .from('products')
        .update(payload)
        .eq('id', productId);
      if (error) throw error;
      setProductStatus(productId, '✓ Saved', 'success');
      setTimeout(() => {
        const el = document.querySelector(`[data-status="${productId}"]`);
        if (el && el.textContent === '✓ Saved') { el.textContent = ''; el.className = 'product-status'; }
      }, 1800);
    } catch (err) {
      console.error(err);
      setProductStatus(productId, '✗ Save failed', 'error');
      toast('Could not save product', 'error');
    } finally {
      setCardSaving(productId, false);
    }
  }

  // ===================================================================
  //  PHOTO UPLOAD
  // ===================================================================
  document.getElementById('productsList').addEventListener('change', async (e) => {
    const productId = e.target.dataset.upload;
    if (!productId) return;
    const file = e.target.files[0];
    if (!file) return;

    const id = Number(productId);
    const uploadLabel = document.querySelector(`[data-upload-label="${id}"]`);
    uploadLabel.classList.add('uploading');
    uploadLabel.querySelector('span')?.remove();
    const originalText = uploadLabel.childNodes[0].textContent;
    uploadLabel.childNodes[0].textContent = '⏳ Uploading…';
    setProductStatus(id, 'Uploading photo…', 'saving');

    try {
      const compressed = await compressImageFile(file);
      const publicUrl = await uploadToCloudinary(compressed);

      const { error: updateError } = await supabaseClient
        .from('products')
        .update({ photo_url: publicUrl })
        .eq('id', id);
      if (updateError) throw updateError;

      // Update local state + UI
      const product = currentProducts.find(p => p.id === id);
      if (product) product.photo_url = publicUrl;

      const slot = document.querySelector(`[data-slot="${id}"]`);
      slot.innerHTML = `<img class="photo-preview" src="${escapeHtml(publicUrl)}" alt="" onerror="this.outerHTML='<div class=\\'photo-placeholder\\'>📷</div>'" />`;

      uploadLabel.childNodes[0].textContent = '📷 Change photo';
      setProductStatus(id, '✓ Photo uploaded', 'success');
      toast('Photo uploaded', 'success');
      setTimeout(() => {
        const el = document.querySelector(`[data-status="${id}"]`);
        if (el && el.textContent === '✓ Photo uploaded') { el.textContent = ''; el.className = 'product-status'; }
      }, 2000);
    } catch (err) {
      console.error(err);
      uploadLabel.childNodes[0].textContent = originalText;
      setProductStatus(id, '✗ Upload failed — ' + (err.message || 'try again'), 'error');
      toast('Photo upload failed: ' + (err.message || 'unknown error'), 'error');
    } finally {
      uploadLabel.classList.remove('uploading');
      e.target.value = '';  // reset so same file can be re-selected
    }
  });

  // ===================================================================
  //  DELETE PRODUCT
  // ===================================================================
  document.getElementById('productsList').addEventListener('click', async (e) => {
    const delId = e.target.dataset.delete;
    if (!delId) return;
    const id = Number(delId);
    const product = currentProducts.find(p => p.id === id);
    if (!product) return;

    const name = product.name || 'this product';
    if (!confirm(`Delete "${name}"? This can't be undone.`)) return;

    e.target.disabled = true;
    setProductStatus(id, 'Deleting…', 'saving');

    try {
      // Best-effort: try to delete the photo from storage too
      if (product.photo_url) {
        try {
          const marker = `/storage/v1/object/public/${STORAGE_BUCKET}/`;
          const idx = product.photo_url.indexOf(marker);
          if (idx !== -1) {
            const path = product.photo_url.slice(idx + marker.length);
            await supabaseClient.storage.from(STORAGE_BUCKET).remove([path]);
          }
        } catch (_) { /* ignore cleanup errors */ }
      }

      const { error } = await supabaseClient.from('products').delete().eq('id', id);
      if (error) throw error;

      currentProducts = currentProducts.filter(p => p.id !== id);
      renderProducts();
      toast('Product deleted', 'success');
    } catch (err) {
      console.error(err);
      e.target.disabled = false;
      setProductStatus(id, '✗ Delete failed', 'error');
      toast('Could not delete product', 'error');
    }
  });

  // ===================================================================
  //  ADD NEW PRODUCT
  // ===================================================================
  document.getElementById('addProductBtn').addEventListener('click', async () => {
    const btn = document.getElementById('addProductBtn');
    btn.disabled = true;
    btn.textContent = 'Adding…';
    try {
      const { data, error } = await supabaseClient
        .from('products')
        .insert({ shop_id: currentShop.id, name: '', price: null })
        .select()
        .single();
      if (error) throw error;

      currentProducts.push(data);
      renderProducts();

      // Auto-focus the new product's name input
      setTimeout(() => {
        const newInput = document.querySelector(`input[data-field="name"][data-id="${data.id}"]`);
        if (newInput) {
          newInput.focus();
          newInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 80);

      toast('New product added — fill in the name', 'success');
    } catch (err) {
      console.error(err);
      toast('Could not add product: ' + (err.message || 'unknown error'), 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '＋ Add New Product';
    }
  });

  // ===================================================================
  //  INIT
  // ===================================================================
  init();
</script>

</body>
